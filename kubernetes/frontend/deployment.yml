apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-Deployment

spec:
  replicas: 2
  selector:
    matchLabels: 
      app: frontend-label

  template:
    metadata:
      labels:
        app: frontend-label
    spec:
      containers:
        - name: frontend
          image: suryasuraj/musify-frontned:latest

          ports:
            - containerPort: 80
      
      resources:
        request:
          cpu: "250m"
          memory: "256Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"