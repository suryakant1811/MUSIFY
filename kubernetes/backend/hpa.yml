apiVersion: autoscaling/v2
kind: HorizonatalPodAutosaler
metadata:
  name: backend-hpa

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: backend-Deployment

  minReplicas: 2
  maxReplicas: 8

  metrics:
    - type: Resource
      resources:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75